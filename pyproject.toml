[project]
name = "dl-projects"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "importlib-resources>=7.1.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "tensorflow>=2.21.0",
    "tensorflow-datasets>=4.9.10",
]
[tool.uv.workspace]
members = ["*"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
